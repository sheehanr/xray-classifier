[build-system]
    requires = ["setuptools>=61.0", "wheel"]
    build-backend = "setuptools.build_meta"

[project]
name = "xray-classifier"
version = "0.1.0"
dependencies = [
    "coremltools",
    "kaggle",
    "numpy",
    "pandas",
    "pillow",
    "pydicom",
    "tqdm",
    "torch",
    "torchvision",
]

[tool.setuptools.packages.find]
where = ["."]
